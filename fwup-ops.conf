require-fwup-version="1.16.0"
include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-common.conf")
task validate.a {
    require-partition-offset(0, ${BOOT_A_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "nerves_layout", "expressatt-mbr-v1")
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    require-path-on-device("/", "/dev/mapper/nerves_root_a")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-execute("/usr/lib/expressatt/validate-running a")
    on-init { uboot_setenv(uboot-env, "a.nerves_fw_validated", "1") info("validated a") }
}
task revert.a {
    require-partition-offset(0, ${BOOT_A_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "nerves_layout", "expressatt-mbr-v1")
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    require-path-on-device("/", "/dev/mapper/nerves_root_a")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-uboot-variable(uboot-env, "b.nerves_fw_validated", "1")
    on-init {
        uboot_setenv(uboot-env, "nerves_fw_fallback", "a")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        mbr_write(mbr-b)
    }
}
task prevent-revert.a {
    require-partition-offset(0, ${BOOT_A_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-path-on-device("/", "/dev/mapper/nerves_root_a")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-uboot-variable(uboot-env, "a.nerves_fw_validated", "1")
    on-init {
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_uuid")
        uboot_setenv(uboot-env, "b.nerves_fw_validated", "0")
    }
}



task validate.b {
    require-partition-offset(0, ${BOOT_B_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "nerves_layout", "expressatt-mbr-v1")
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    require-path-on-device("/", "/dev/mapper/nerves_root_b")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    require-execute("/usr/lib/expressatt/validate-running b")
    on-init { uboot_setenv(uboot-env, "b.nerves_fw_validated", "1") info("validated b") }
}
task revert.b {
    require-partition-offset(0, ${BOOT_B_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "nerves_layout", "expressatt-mbr-v1")
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    require-path-on-device("/", "/dev/mapper/nerves_root_b")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    require-uboot-variable(uboot-env, "a.nerves_fw_validated", "1")
    on-init {
        uboot_setenv(uboot-env, "nerves_fw_fallback", "b")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        mbr_write(mbr-a)
    }
}
task prevent-revert.b {
    require-partition-offset(0, ${BOOT_B_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_B_PART_OFFSET})
    require-path-on-device("/", "/dev/mapper/nerves_root_b")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    require-uboot-variable(uboot-env, "b.nerves_fw_validated", "1")
    on-init {
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_uuid")
        uboot_setenv(uboot-env, "a.nerves_fw_validated", "0")
    }
}



task factory-reset {
    require-uboot-variable(uboot-env, "nerves_layout", "expressatt-mbr-v1")
    on-init {
        trim(${APP_PART_OFFSET}, ${APP_PART_COUNT})
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}
task validate.fail { on-init { error("validate: inconsistent running slot or metadata") } }
task revert.fail { on-init { error("revert: inconsistent running slot or metadata") } }
task prevent-revert.fail { on-init { error("prevent-revert: inconsistent running slot or metadata") } }


task status.aa {
    require-path-on-device("/", "/dev/mapper/nerves_root_a")
    require-partition-offset(0, ${BOOT_A_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    on-init { info("a") }
}

task status.ab {
    require-path-on-device("/", "/dev/mapper/nerves_root_a")
    require-partition-offset(0, ${BOOT_B_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_B_PART_OFFSET})
    on-init { info("a->b") }
}

task status.ba {
    require-path-on-device("/", "/dev/mapper/nerves_root_b")
    require-partition-offset(0, ${BOOT_A_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    on-init { info("b->a") }
}

task status.bb {
    require-path-on-device("/", "/dev/mapper/nerves_root_b")
    require-partition-offset(0, ${BOOT_B_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_B_PART_OFFSET})
    on-init { info("b") }
}
task status.fail { on-init { error("status: inconsistent running root or nested MBR") } }
