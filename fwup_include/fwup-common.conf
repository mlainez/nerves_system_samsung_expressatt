define(NERVES_FW_PRODUCT, "Samsung Galaxy Express Nerves")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "samsung-expressatt")
define(NERVES_FW_ARCHITECTURE, "arm")
define(NERVES_FW_AUTHOR, "Express port contributors")
define(NERVES_FW_DEVPATH, "/dev/mmcblk0p15")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mapper/nerves_app")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")
define(UBOOT_ENV_OFFSET, 2048)
define(UBOOT_ENV_COUNT, 256)
define(UBOOT_ENV_REDUND_OFFSET, 2304)
define(BOOT_A_PART_OFFSET, 4096)
define(BOOT_B_PART_OFFSET, 135168)
define(BOOT_PART_COUNT, 131072)
define(ROOTFS_A_PART_OFFSET, 266240)
define(ROOTFS_B_PART_OFFSET, 790528)
define(ROOTFS_PART_COUNT, 524288)
define(APP_PART_OFFSET, 1314816)
define(APP_PART_COUNT, 9392128)
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-offset-redund = ${UBOOT_ENV_REDUND_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

mbr mbr-a {
    partition 0 { block-offset = ${BOOT_A_PART_OFFSET} block-count = ${BOOT_PART_COUNT} type = 0x83 boot = true }
    partition 1 { block-offset = ${ROOTFS_A_PART_OFFSET} block-count = ${ROOTFS_PART_COUNT} type = 0x83 }
    partition 2 { block-offset = ${APP_PART_OFFSET} block-count = ${APP_PART_COUNT} type = 0x83 }
}

mbr mbr-b {
    partition 0 { block-offset = ${BOOT_B_PART_OFFSET} block-count = ${BOOT_PART_COUNT} type = 0x83 boot = true }
    partition 1 { block-offset = ${ROOTFS_B_PART_OFFSET} block-count = ${ROOTFS_PART_COUNT} type = 0x83 }
    partition 2 { block-offset = ${APP_PART_OFFSET} block-count = ${APP_PART_COUNT} type = 0x83 }
}
