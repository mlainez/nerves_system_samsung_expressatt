name: Source checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check host and initramfs scripts
        run: |
          shellcheck post-build.sh post-createfs.sh scripts/create-boot-img.sh \
            initramfs/init initramfs/read-layout \
            packages/expressatt-firmware/expressatt-bringup \
            rootfs_overlay/usr/lib/expressatt/validate-running
